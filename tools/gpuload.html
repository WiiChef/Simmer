<!doctype html>
<html><head><meta charset="utf-8"><title>GPU load</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}canvas{width:100%;height:100%;display:block}#f{position:fixed;top:8px;left:8px;color:#0f0;font:16px monospace}</style></head>
<body><canvas id="c"></canvas><div id="f"></div>
<script>
// Fragment-shader stress load for PowerCap GPU tests: ITER loop iterations per pixel, every frame.
const ITER = Number(new URLSearchParams(location.search).get('iter') || 20000);
const c = document.getElementById('c'), gl = c.getContext('webgl2');
const vs = `#version 300 es
in vec2 p; void main(){ gl_Position = vec4(p,0,1); }`;
const fs = `#version 300 es
precision highp float; uniform float t; uniform vec2 r; out vec4 o;
void main(){ vec2 uv = gl_FragCoord.xy / r; vec3 a = vec3(uv, t);
  for (int i = 0; i < ${ITER}; i++) { a = abs(a) / dot(a, a) - vec3(0.9, 0.6, 0.4 + 0.1 * sin(t)); }
  o = vec4(clamp(a * 0.1, 0.0, 1.0), 1.0); }`;
function sh(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; }
const pr = gl.createProgram(); gl.attachShader(pr, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(pr); gl.useProgram(pr);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(pr, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
const ut = gl.getUniformLocation(pr, 't'), ur = gl.getUniformLocation(pr, 'r');
let n = 0, last = performance.now(); window.fps = 0;
function frame(now) {
  c.width = c.clientWidth; c.height = c.clientHeight; gl.viewport(0, 0, c.width, c.height);
  gl.uniform1f(ut, now / 1000); gl.uniform2f(ur, c.width, c.height); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  n++; if (now - last > 1000) { window.fps = n * 1000 / (now - last); document.getElementById('f').textContent = window.fps.toFixed(1) + ' fps'; n = 0; last = now; }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
